<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Table Master, l'application de réservation et de gestion de tables pour clients et restaurateurs.">
  <meta name="theme-color" content="#3F51B5">

  <!-- Open Graph -->
  <meta property="og:title" content="Table Master">
  <meta property="og:description" content="Réservation et gestion de tables pour clients et restaurateurs.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Table Master">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Table Master</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { height: 100%; margin: 0; padding: 0; background-color: #ffffff; }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #121212; }
    }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background-color: #3F51B5; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 1.2rem; letter-spacing: 0.04em;
    }
  </style>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAjNUGYNxvg_R5o9I4FZi-FziKucF0C2W4&loading=async" async></script>
</head>
<body>
  <div id="splash">Table Master</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
